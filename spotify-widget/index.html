<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify — Now Playing</title>
    <link rel="stylesheet" href="./spotify.css">
</head>
<body>

<div class="window" id="player-window">

    <!-- Title bar -->
    <div class="title-bar">
        <span class="title-bar-icon" style="font-size:12px; text-align:center;">♪</span>
        <span class="title-bar-text" id="window-title">Spotify — Now Playing</span>
        <div class="title-bar-buttons">
            <div class="tb-btn" title="Minimize">_</div>
            <div class="tb-btn" title="Maximize">□</div>
            <div class="tb-btn" title="Close" style="font-weight:bold;">✕</div>
        </div>
    </div>

    <!-- Menu bar -->
    <div class="menu-bar">
        <span class="menu-item">File</span>
        <span class="menu-item">Playback</span>
        <span class="menu-item">Options</span>
        <span class="menu-item">Help</span>
    </div>

    <!-- Main content -->
    <div class="content">

        <!-- Track row -->
        <div class="track-row">
            <div class="art-frame">
                <img id="album-art" src="" alt="" style="display:none;">
                <span class="art-placeholder" id="art-placeholder">♪</span>
            </div>
            <div class="track-info">
                <div class="field-label">Track</div>
                <div class="info-field marquee-wrap" id="track-name-wrap">
                    <span id="track-name">—</span>
                </div>
                <div class="field-label">Artist</div>
                <div class="info-field marquee-wrap" id="artist-name-wrap">
                    <span id="artist-name">—</span>
                </div>
                <div class="field-label">Album</div>
                <div class="info-field marquee-wrap" id="album-name-wrap">
                    <span id="album-name">—</span>
                </div>
                <div class="status-row">
                    <div class="status-led" id="status-led"></div>
                    <span class="status-text" id="status-text">Idle</span>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <span class="time-display" id="time-elapsed">0:00</span>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time-display" id="time-total">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="ctrl-btn" id="btn-prev" title="Previous">|◄◄</button>
            <button class="ctrl-btn" id="btn-play" title="Play/Pause">▶</button>
            <button class="ctrl-btn" id="btn-next" title="Next">▶▶|</button>
        </div>

    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-panel" id="sb-device">No device</div>
        <div class="status-panel" id="sb-volume" style="max-width:70px;">Vol: —</div>
    </div>

</div>

<script type="module" src="./spotify.ts"></script>
</body>
</html>
