<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify — Now Playing</title>
    <style>
        @font-face {
            font-family: "w95fa";
            src: url("../fonts/w95fa.woff") format("woff");
        }
        @font-face {
            font-family: "PixelifySans";
            src: url("../fonts/PixelifySans-VariableFont_wght.ttf") format("truetype");
        }

        :root {
            --bg:      #C0C0C0;
            --dark:    #808080;
            --light:   #FFFFFF;
            --blue:    #000080;
            --text:    #000000;
            --desktop: #018281;
            --green:   #008000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "w95fa", "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            background: var(--desktop);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            image-rendering: pixelated;
        }

        /* ── Window shell ─────────────────────────────────────── */
        .window {
            background: var(--bg);
            border: 2px solid;
            border-color: var(--light) var(--dark) var(--dark) var(--light);
            box-shadow: 1px 1px 0 1px var(--text), inset -1px -1px 0 1px var(--dark);
            padding: 3px;
            width: 380px;
            user-select: none;
        }

        /* ── Title bar ────────────────────────────────────────── */
        .title-bar {
            background: linear-gradient(to right, var(--blue) 0%, #1084d0 100%);
            color: var(--light);
            padding: 3px 4px 3px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 3px;
        }

        .title-bar-icon {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .title-bar-text {
            flex: 1;
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .title-bar-buttons {
            display: flex;
            gap: 2px;
        }

        .tb-btn {
            width: 16px;
            height: 14px;
            background: var(--bg);
            border: 1px solid;
            border-color: var(--light) var(--dark) var(--dark) var(--light);
            box-shadow: inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 9px;
            color: var(--text);
            line-height: 1;
        }
        .tb-btn:active {
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            box-shadow: inset 1px 1px 0 var(--dark);
        }

        /* ── Menu bar ─────────────────────────────────────────── */
        .menu-bar {
            border-bottom: 1px solid var(--dark);
            padding: 2px 4px;
            display: flex;
            gap: 2px;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .menu-item {
            padding: 1px 6px;
            cursor: pointer;
        }
        .menu-item:hover {
            background: var(--blue);
            color: var(--light);
        }

        /* ── Inner content ────────────────────────────────────── */
        .content {
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* ── Top row: art + track info ────────────────────────── */
        .track-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        /* Album art inset box */
        .art-frame {
            border: 2px solid;
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            box-shadow: inset 1px 1px 0 var(--text);
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            overflow: hidden;
            background: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: auto;
        }

        .art-placeholder {
            color: #404040;
            font-size: 28px;
            line-height: 1;
        }

        /* Track text panel */
        .track-info {
            flex: 1;
            min-width: 0;
        }

        .info-field {
            border: 1px solid;
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            box-shadow: inset 1px 1px 0 var(--dark);
            background: var(--light);
            padding: 2px 4px;
            margin-bottom: 4px;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .field-label {
            font-size: 10px;
            color: var(--dark);
            margin-bottom: 1px;
        }

        .track-name {
            font-weight: bold;
            font-size: 12px;
        }

        /* Status indicator */
        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dark);
            border: 1px solid #404040;
            flex-shrink: 0;
        }
        .status-led.playing { background: #00ff00; box-shadow: 0 0 4px #00ff00; }
        .status-led.paused  { background: #ffff00; }

        .status-text { font-size: 10px; }

        /* ── Progress section ─────────────────────────────────── */
        .progress-section {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
        }

        .time-display {
            font-family: "w95fa", monospace;
            font-size: 10px;
            white-space: nowrap;
            min-width: 32px;
            text-align: right;
        }

        /* Win95-style progress bar */
        .progress-track {
            flex: 1;
            height: 14px;
            border: 1px solid;
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            box-shadow: inset 1px 1px 0 var(--dark);
            background: var(--light);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                var(--blue) 0px,
                var(--blue) 10px,
                #1084d0 10px,
                #1084d0 11px
            );
            width: 0%;
            transition: width 1s linear;
        }

        /* ── Controls ─────────────────────────────────────────── */
        .controls {
            display: flex;
            gap: 4px;
            justify-content: center;
            padding: 2px 0;
        }

        .ctrl-btn {
            background: var(--bg);
            border: 1px solid;
            border-color: var(--light) var(--dark) var(--dark) var(--light);
            box-shadow: 1px 1px 0 var(--text), inset -1px -1px 0 var(--dark), inset 1px 1px 0 var(--light);
            padding: 3px 10px;
            cursor: pointer;
            font-family: "w95fa", "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            color: var(--text);
            min-width: 36px;
            text-align: center;
        }
        .ctrl-btn:active {
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            box-shadow: inset 1px 1px 0 var(--dark), inset -1px -1px 0 var(--light);
            padding: 4px 9px 2px 11px;
        }
        .ctrl-btn:disabled {
            color: var(--dark);
            cursor: default;
        }

        /* ── Status bar ───────────────────────────────────────── */
        .status-bar {
            border-top: 1px solid var(--dark);
            margin-top: 4px;
            padding: 2px 6px;
            font-size: 10px;
            color: var(--dark);
            display: flex;
            gap: 8px;
        }

        .status-panel {
            border: 1px solid;
            border-color: var(--dark) var(--light) var(--light) var(--dark);
            padding: 1px 4px;
            flex: 1;
        }

        /* ── Scrolling marquee for long titles ────────────────── */
        @keyframes marquee {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .marquee-wrap {
            overflow: hidden;
            white-space: nowrap;
        }
        .marquee-wrap.scrolling span {
            display: inline-block;
            animation: marquee 8s linear infinite;
        }

        /* ── Error / idle states ──────────────────────────────── */
        .idle-msg {
            text-align: center;
            padding: 20px 10px;
            color: var(--dark);
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="window" id="player-window">

    <!-- Title bar -->
    <div class="title-bar">
        <!-- Simple music note rendered as text for the icon -->
        <span class="title-bar-icon" style="font-size:12px; text-align:center;">♪</span>
        <span class="title-bar-text" id="window-title">Spotify — Now Playing</span>
        <div class="title-bar-buttons">
            <div class="tb-btn" title="Minimize">_</div>
            <div class="tb-btn" title="Maximize">□</div>
            <div class="tb-btn" title="Close" style="font-weight:bold;">✕</div>
        </div>
    </div>

    <!-- Menu bar -->
    <div class="menu-bar">
        <span class="menu-item">File</span>
        <span class="menu-item">Playback</span>
        <span class="menu-item">Options</span>
        <span class="menu-item">Help</span>
    </div>

    <!-- Main content -->
    <div class="content">

        <!-- Track row -->
        <div class="track-row">
            <div class="art-frame">
                <img id="album-art" src="" alt="" style="display:none;">
                <span class="art-placeholder" id="art-placeholder">♪</span>
            </div>
            <div class="track-info">
                <div class="field-label">Track</div>
                <div class="info-field marquee-wrap" id="track-name-wrap">
                    <span id="track-name">—</span>
                </div>
                <div class="field-label">Artist</div>
                <div class="info-field marquee-wrap" id="artist-name-wrap">
                    <span id="artist-name">—</span>
                </div>
                <div class="field-label">Album</div>
                <div class="info-field marquee-wrap" id="album-name-wrap">
                    <span id="album-name">—</span>
                </div>
                <div class="status-row">
                    <div class="status-led" id="status-led"></div>
                    <span class="status-text" id="status-text">Idle</span>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <span class="time-display" id="time-elapsed">0:00</span>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="time-display" id="time-total">0:00</span>
        </div>

        <!-- Controls (visual only — actual control requires extra Spotify scopes) -->
        <div class="controls">
            <button class="ctrl-btn" id="btn-prev" onclick="spotifyControl('previous')" title="Previous">|◄◄</button>
            <button class="ctrl-btn" id="btn-play" onclick="spotifyControl('play-pause')" title="Play/Pause">▶</button>
            <button class="ctrl-btn" id="btn-next" onclick="spotifyControl('next')"  title="Next">▶▶|</button>
        </div>

    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div class="status-panel" id="sb-device">No device</div>
        <div class="status-panel" id="sb-volume" style="max-width:70px;">Vol: —</div>
    </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONFIG — fill in your Spotify credentials here
//  Get them at: https://developer.spotify.com/dashboard
// ══════════════════════════════════════════════════════════════
const CONFIG = {
    clientId:     "c864b2fd443a416fad834239e38ee6cc",
    clientSecret: "fd9032c27a184ca08779ee27f34a341e",
    refreshToken: "AQBbi_q54QUqTuZXbmEiJJ_zP9Ap0uDP7qJQqMSEJEzHFRhMPG-CXSd_ZWYQ4u0JVDR4V88ofilJXiDILjE-PvIVr2lDed6DAP-vZnxcgjjgdS7vYzz3TPzjADcH8I_wZB8",
    pollInterval: 5000,   // ms between track polls
};
// ══════════════════════════════════════════════════════════════

let accessToken = null;
let tokenExpiry = 0;
let isPlaying   = false;
let progressInterval = null;
let currentProgress  = 0;
let currentDuration  = 1;

// ── Token management ───────────────────────────────────────────
async function getAccessToken() {
    if (accessToken && Date.now() < tokenExpiry - 30000) return accessToken;

    const creds = btoa(`${CONFIG.clientId}:${CONFIG.clientSecret}`);
    const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {
            "Authorization": `Basic ${creds}`,
            "Content-Type":  "application/x-www-form-urlencoded",
        },
        body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(CONFIG.refreshToken)}`,
    });

    if (!res.ok) throw new Error(`Token error: ${res.status}`);
    const data = await res.json();
    accessToken = data.access_token;
    tokenExpiry = Date.now() + data.expires_in * 1000;
    return accessToken;
}

// ── Spotify API helpers ────────────────────────────────────────
async function fetchCurrentlyPlaying() {
    const token = await getAccessToken();
    const res = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { "Authorization": `Bearer ${token}` },
    });
    if (res.status === 204) return null;  // nothing playing
    if (!res.ok) throw new Error(`API error: ${res.status}`);
    return res.json();
}

async function fetchPlayer() {
    const token = await getAccessToken();
    const res = await fetch("https://api.spotify.com/v1/me/player", {
        headers: { "Authorization": `Bearer ${token}` },
    });
    if (res.status === 204 || res.status === 200 && res.headers.get("content-length") === "0") return null;
    if (!res.ok) throw new Error(`Player error: ${res.status}`);
    const text = await res.text();
    return text ? JSON.parse(text) : null;
}

async function spotifyControl(action) {
    try {
        const token = await getAccessToken();
        let method = "POST", url;
        if (action === "play-pause") {
            const endpoint = isPlaying ? "pause" : "play";
            url = `https://api.spotify.com/v1/me/player/${endpoint}`;
            method = "PUT";
        } else {
            url = `https://api.spotify.com/v1/me/player/${action}`;
        }
        await fetch(url, {
            method,
            headers: { "Authorization": `Bearer ${token}` },
        });
        setTimeout(updateDisplay, 500);
    } catch (e) {
        setStatus(`Control error: ${e.message}`);
    }
}

// ── UI helpers ─────────────────────────────────────────────────
function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return `${m}:${String(s % 60).padStart(2, "0")}`;
}

function setMarquee(wrapId, spanId, text) {
    const wrap = document.getElementById(wrapId);
    const span = document.getElementById(spanId);
    span.textContent = text;
    // Scroll only if text overflows
    const overflows = span.scrollWidth > wrap.clientWidth;
    wrap.classList.toggle("scrolling", overflows);
}

function setStatus(msg) {
    document.getElementById("sb-device").textContent = msg;
}

function startProgressTick() {
    clearInterval(progressInterval);
    if (!isPlaying) return;
    progressInterval = setInterval(() => {
        currentProgress = Math.min(currentProgress + 1000, currentDuration);
        renderProgress();
    }, 1000);
}

function renderProgress() {
    const pct = currentDuration > 0 ? (currentProgress / currentDuration) * 100 : 0;
    document.getElementById("progress-fill").style.width = `${pct}%`;
    document.getElementById("time-elapsed").textContent = formatTime(currentProgress);
    document.getElementById("time-total").textContent   = formatTime(currentDuration);
}

// ── Main update loop ───────────────────────────────────────────
async function updateDisplay() {
    if (CONFIG.clientId === "YOUR_CLIENT_ID") {
        setStatus("⚠ Add your Spotify credentials in index.html");
        return;
    }

    try {
        const [cpData, playerData] = await Promise.all([
            fetchCurrentlyPlaying(),
            fetchPlayer(),
        ]);

        if (!cpData || !cpData.item) {
            // Nothing playing
            isPlaying = false;
            clearInterval(progressInterval);
            document.getElementById("status-led").className  = "status-led";
            document.getElementById("status-text").textContent = "Not playing";
            document.getElementById("btn-play").textContent   = "▶";
            document.getElementById("window-title").textContent = "Spotify — Now Playing";
            setMarquee("track-name-wrap", "track-name", "—");
            setMarquee("artist-name-wrap", "artist-name", "—");
            setMarquee("album-name-wrap", "album-name", "—");
            document.getElementById("album-art").style.display   = "none";
            document.getElementById("art-placeholder").style.display = "";
            currentProgress = 0; currentDuration = 1;
            renderProgress();
            setStatus("No track playing");
            document.getElementById("sb-volume").textContent = "Vol: —";
            return;
        }

        const item   = cpData.item;
        const artist = item.artists.map(a => a.name).join(", ");
        const album  = item.album.name;
        const art    = item.album.images[0] && item.album.images[0].url;

        isPlaying       = cpData.is_playing;
        currentProgress = cpData.progress_ms;
        currentDuration = item.duration_ms;

        // Album art
        if (art) {
            const img = document.getElementById("album-art");
            img.src = art;
            img.style.display = "";
            document.getElementById("art-placeholder").style.display = "none";
        }

        // Text fields
        setMarquee("track-name-wrap", "track-name", item.name);
        setMarquee("artist-name-wrap", "artist-name", artist);
        setMarquee("album-name-wrap", "album-name", album);

        // Window title
        document.getElementById("window-title").textContent =
            isPlaying ? `▶ ${item.name} — ${artist}` : `⏸ ${item.name} — ${artist}`;

        // LED + play button
        const led = document.getElementById("status-led");
        led.className = "status-led " + (isPlaying ? "playing" : "paused");
        document.getElementById("status-text").textContent  = isPlaying ? "Playing" : "Paused";
        document.getElementById("btn-play").textContent     = isPlaying ? "⏸" : "▶";

        // Progress
        renderProgress();
        startProgressTick();

        // Device / volume from player endpoint
        if (playerData && playerData.device) {
            setStatus(`🖥 ${playerData.device.name}`);
            const vol = playerData.device.volume_percent;
            document.getElementById("sb-volume").textContent = `Vol: ${vol}%`;
        }

    } catch (e) {
        clearInterval(progressInterval);
        setStatus(`Error: ${e.message}`);
        console.error(e);
    }
}

// ── Boot ───────────────────────────────────────────────────────
updateDisplay();
setInterval(updateDisplay, CONFIG.pollInterval);
</script>
</body>
</html>
